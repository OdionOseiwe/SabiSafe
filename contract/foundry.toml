[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.29"
# Aurora testnet does not reliably report PUSH0 (EIP-3855) support, so target
# Paris to keep the deployed bytecode compatible.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
# Set AURORA_RPC_URL in your shell to override. The official endpoint is
# intermittent, so a public fallback is provided.
aurora_testnet = "${AURORA_RPC_URL}"
aurora_testnet_drpc = "https://aurora-testnet.drpc.org"
aurora_testnet_thirdweb = "https://aurora-testnet.rpc.thirdweb.com"
